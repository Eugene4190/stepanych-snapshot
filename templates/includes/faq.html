<section class="section section--faq{% if faq_light %} section--faq--light{% endif %}">
    <div class="container">
        <div class="section__header">
            <h2 class="section__title">Частые вопросы</h2>
        </div>
        <div class="faq">
            {% for item in faq %}
            <details class="faq__item">
                <summary class="faq__q">{{ item.q }}</summary>
                <p class="faq__a">{{ item.a }}</p>
            </details>
            {% endfor %}
        </div>
    </div>
</section>
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{% for item in faq %}{"@type": "Question", "name": "{{ item.q }}", "acceptedAnswer": {"@type": "Answer", "text": "{{ item.a }}"}}{% if not forloop.last %},{% endif %}{% endfor %}]}
</script>
