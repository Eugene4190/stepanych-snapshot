<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Степаныч — прочистка канализации и сантехработы в Барановичах{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Прочистка канализации и сантехнические работы в Барановичах и районе. Мастер без посредников, цена до начала работ, гарантия 14 дней, выезд без выходных.{% endblock %}">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="{% block og_title %}Степаныч — прочистка канализации и сантехработы в Барановичах{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Прочистка канализации и сантехнические работы в Барановичах и районе. Цена до начала работ, гарантия.{% endblock %}">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:site_name" content="Степаныч">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Степаныч. Прочистка канализации и сантехработы",
      "image": "{{ request.scheme }}://{{ request.get_host }}/static/img/emblem.png",
      "telephone": "{{ site_phone }}",
      "priceRange": "от 100 руб",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Барановичи",
        "addressCountry": "BY"
      },
      "areaServed": ["Барановичи", "Барановичский район", "Ляховичи", "Ивацевичи", "Ганцевичи", "Слоним", "Несвиж", "Лида"],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "09:00",
        "closes": "23:00"
      },
      "url": "{{ request.scheme }}://{{ request.get_host }}/"
    }
    </script>
</head>
<body>
