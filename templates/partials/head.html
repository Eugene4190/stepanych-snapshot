{% load social %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>
        window.SITE_ANALYTICS = {
            metricaId: '{{ metrica_id }}',
            gaId: '{{ ga_id }}'
        };
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Степаныч — прочистка канализации и сантехработы в Барановичах{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Прочистка канализации и сантехнические работы в Барановичах и районе. Мастер без посредников, цена до начала работ, выезд без выходных.{% endblock %}">
    {% block robots %}<meta name="robots" content="index, follow">{% endblock %}
    {% block canonical %}<link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">{% endblock %}
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="{% block og_title %}Прочистка канализации и сантехработы в Барановичах — без выходных{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Прочистка канализации и сантехнические работы в Барановичах и районе. Цена до начала работ.{% endblock %}">
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:site_name" content="Степаныч">
    <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}/static/img/square-avr.png{% endblock %}">
    <meta property="og:image:width" content="{% block og_image_width %}1080{% endblock %}">
    <meta property="og:image:height" content="{% block og_image_height %}1080{% endblock %}">
    <meta property="og:image:alt" content="Степаныч — прочистка канализации и сантехработы, Барановичи">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#f4f6f9">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-192.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="{{ 'css/style.css'|asset_url }}">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Plumber",
      "name": "Степаныч. Прочистка канализации и сантехработы",
      "image": "{{ request.scheme }}://{{ request.get_host }}/static/img/emblem.png",
      "logo": "{{ request.scheme }}://{{ request.get_host }}/static/img/emblem.png",
      "telephone": "{{ site_phone }}",
      "priceRange": "от 100 BYN за прочистку, от 15 BYN за метр гидродинамической промывки прямых участков",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Барановичи",
        "addressCountry": "BY"
      },
      "areaServed": ["Барановичи"{% for r in regions %}, "{{ r.name }}"{% endfor %}],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "09:00",
        "closes": "23:00"
      },
      "sameAs": ["https://vsf.by/yura"],
      "founder": {"@type": "Person", "name": "Молчан Юрий Степанович"},
      "url": "{{ request.scheme }}://{{ request.get_host }}/"
    }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
