<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Степаныч — прочистка канализации и сантехработы в Барановичах{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Прочистка канализации и сантехнические работы в Барановичах и районе. Мастер без посредников, цена до начала работ, гарантия 14 дней, выезд без выходных.{% endblock %}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="{% block og_title %}Степаныч — прочистка канализации и сантехработы в Барановичах{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Прочистка канализации и сантехнические работы в Барановичах и районе. Цена до начала работ, гарантия.{% endblock %}">
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:site_name" content="Степаныч">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}/static/img/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Степаныч — прочистка канализации и сантехработы, Барановичи">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#f2f5fa">
    <link rel="icon" href="/static/img/emblem.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Plumber",
      "name": "Степаныч. Прочистка канализации и сантехработы",
      "image": "{{ request.scheme }}://{{ request.get_host }}/static/img/emblem.png",
      "logo": "{{ request.scheme }}://{{ request.get_host }}/static/img/emblem.png",
      "telephone": "{{ site_phone }}",
      "priceRange": "от 100 BYN",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Барановичи",
        "addressCountry": "BY"
      },
      "areaServed": ["Барановичи"{% for r in regions %}, "{{ r.name }}"{% endfor %}],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "09:00",
        "closes": "23:00"
      },
      "sameAs": ["https://vsf.by/yura"],
      "founder": {"@type": "Person", "name": "Молчан Юрий Степанович"},
      "url": "{{ request.scheme }}://{{ request.get_host }}/"
    }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
