<!DOCTYPE html>
<html lang="ru">
<head>

    <title>{% block title %}Степаныч — прочистка канализации и сантехработы в Барановичах{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Прочистка канализации и сантехнические работы в Барановичах и районе. Мастер без посредников, цена до начала работ, гарантия 14 дней, выезд без выходных.{% endblock %}">

    <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="{% block og_title %}Прочистка канализации и сантехработы в Барановичах — без выходных{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Прочистка канализации и сантехнические работы в Барановичах и районе. Цена до начала работ, гарантия.{% endblock %}">

    <meta property="og:site_name" content="Степаныч">
    <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}/static/img/square-avr.png{% endblock %}">

    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

        "opens": "09:00",
        "closes": "23:00"

      "sameAs": ["https://vsf.by/yura"],
      "founder": {"@type": "Person", "name": "Молчан Юрий Степанович"},
      "url": "{{ request.scheme }}://{{ request.get_host }}/"

<body>
{% block body %}{% endblock %}
