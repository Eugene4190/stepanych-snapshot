    <header class="header">
        <div class="header__container">
            <div class="header__left">
                <button class="burger" id="burger" aria-label="Меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <a href="/" class="logo">
                    <img src="{{ site_logo|default:'/static/img/emblem.png' }}" alt="Степаныч" class="logo__img">
                    <span class="logo__title">Степаныч</span>
                </a>
            </div>
            <nav class="nav-desktop">
                <ul class="nav-desktop__list">
                    <li class="nav-desktop__item"><a href="/" class="nav-desktop__link{% if request.path == '/' %} nav-desktop__link--active{% endif %}">Главная</a></li>
                    <li class="nav-desktop__item"><a href="{% if region %}#prochistka{% else %}/prochistka-kanalizatsii/{% endif %}" class="nav-desktop__link{% if request.path == '/prochistka-kanalizatsii/' %} nav-desktop__link--active{% endif %}">Прочистка</a></li>
                    <li class="nav-desktop__item"><a href="{% if region %}#santehnika{% else %}/santekhnicheskie-raboty/{% endif %}" class="nav-desktop__link{% if request.path == '/santekhnicheskie-raboty/' %} nav-desktop__link--active{% endif %}">Сантехработы</a></li>
                    <li class="nav-desktop__item"><a href="/o-nas/" class="nav-desktop__link{% if request.path == '/o-nas/' %} nav-desktop__link--active{% endif %}">О нас</a></li>
                    <li class="nav-desktop__item"><a href="/kontakty/" class="nav-desktop__link{% if request.path == '/kontakty/' %} nav-desktop__link--active{% endif %}">Контакты</a></li>
                </ul>
            </nav>
            <div class="header__right">
                <a href="tel:{{ site_phone }}" class="header__phone-text">{{ site_phone_display }}</a>
                <a href="tel:{{ site_phone }}" class="header__phone" aria-label="Позвонить">
                    <i class="fas fa-phone"></i>
                </a>
                <a href="#order" class="header__call">Оставить заявку</a>
            </div>
        </div>
    </header>

    <nav class="nav" id="nav">
        <div class="nav__overlay" id="navOverlay"></div>
        <div class="nav__panel">
            <button class="nav__close" id="navClose" aria-label="Закрыть меню">&times;</button>
            <ul class="nav__list">
                <li class="nav__item"><a href="/" class="nav__link">Главная</a></li>
                <li class="nav__item"><a href="{% if region %}#prochistka{% else %}/prochistka-kanalizatsii/{% endif %}" class="nav__link">Прочистка</a></li>
                <li class="nav__item"><a href="{% if region %}#santehnika{% else %}/santekhnicheskie-raboty/{% endif %}" class="nav__link">Сантехработы</a></li>
                <li class="nav__item"><a href="/o-nas/" class="nav__link">О нас</a></li>
                <li class="nav__item"><a href="/kontakty/" class="nav__link">Контакты</a></li>
            </ul>
        </div>
    </nav>
